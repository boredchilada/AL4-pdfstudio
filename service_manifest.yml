name: PdfStudio
version: $SERVICE_TAG
description: >-
  Static structural analysis of PDF files using pdfstudio
  (https://github.com/boredchilada/pdfstudio). Walks the PDF catalog graph,
  applies 30+ structural detection rules, tracks per-revision weaponization,
  detects embedded payloads (PE/ELF/ZIP) and auto-executing actions, and
  extracts cleartext indicators of compromise. Read-only and offline by design.

# File routing
accepts: document/pdf
rejects: empty|metadata/.*

stage: CORE
category: Static Analysis

file_required: true
timeout: 120
disable_cache: false

enabled: true
is_external: false
privileged: false

# Static service configuration (-> self.config)
config:
  # Seconds before the pdfstudio subprocess is aborted; capped at the service `timeout` minus 10.
  internal_timeout: 110
  # Maximum number of IOCs tagged per type (1-5000).
  max_iocs: 200
  # Maximum number of embedded payloads listed or extracted per file (1-500).
  max_extracted_payloads: 30
  # Extra domains not tagged as IOCs; their subdomains are skipped too. Added to the built-in
  # list of XMP and metadata namespaces.
  safelist_domains: []

# Per-submission tunables (-> request.get_param)
submission_params:
  - name: show_object_table
    type: bool
    default: false
    value: false
  - name: extract_payloads
    type: bool
    default: true
    value: true

heuristics:
  - heur_id: 1
    name: High Severity PDF Indicator
    score: 1000
    filetype: document/pdf
    attack_id:
      - T1204
    description: >-
      pdfstudio flagged a HIGH severity indicator, such as an embedded
      executable, a launch/command action, or auto-executing JavaScript.
    signature_score_map:
      # HIGH codes not listed here (embedded_pe, embedded_elf, launch, launch_*) score 1000.
      openaction_js: 750
      # Inline JavaScript in /AA. Form fields use it for number and date formatting; pages and
      # documents fire it on open, close or print.
      aa_javascript: 500
      aa_javascript_field: 100
      js_export_data_object: 750
      filespec_ext_mismatch: 500
      not_a_pdf: 100
      # Links need a click; a link to an executable or archive is suspicious, not malicious.
      uri_to_executable: 300
  - heur_id: 2
    name: Medium Severity PDF Indicator
    score: 500
    filetype: document/pdf
    description: pdfstudio flagged a MED severity structural indicator.
    signature_score_map:
      # Incremental updates and password protection are common in benign documents;
      # cross-revision weaponization is scored by heuristic 6.
      multi_rev: 0
      encrypted: 0
      # Link targets need a click and are common in technical documents.
      url_shortener: 100
      dynamic_dns: 100
      abused_file_host: 100
      raw_ip_uri: 100
      canarytoken: 100
      base64_in_uri: 100
  - heur_id: 3
    name: Low Severity PDF Indicator
    score: 100
    filetype: document/pdf
    description: pdfstudio flagged a LOW severity indicator.

  - heur_id: 4
    name: Informational PDF Observation
    score: 0
    filetype: document/pdf
    description: pdfstudio reported an informational metadata observation.

  - heur_id: 5
    name: Catalog Trigger Path
    score: 0
    filetype: document/pdf
    attack_id:
      - T1204
    description: >-
      pdfstudio's catalog-graph walk found a trigger path (e.g. /OpenAction
      or /AA) reaching a JavaScript or Launch action. Context section; the
      action itself is scored under heuristic 1.
  - heur_id: 6
    name: Multi-Revision Weaponization
    score: 750
    filetype: document/pdf
    attack_id:
      - T1027
    description: >-
      An incremental update introduced or rewrote objects in a manner
      consistent with weaponization across revisions.

  - heur_id: 7
    name: PDF Parse Anomaly
    score: 100
    filetype: document/pdf
    description: >-
      pdfstudio reported parse warnings indicating a malformed or evasive
      PDF structure.

docker_config:
  image: ghcr.io/boredchilada/al4-pdfstudio:$SERVICE_TAG
  cpu_cores: 1.0
  ram_mb: 2048
  allow_internet_access: false
